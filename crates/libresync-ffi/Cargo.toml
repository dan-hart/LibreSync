[package]
name = "libresync-ffi"
version = "0.6.1"
edition = "2021"
license = "AGPL-3.0-only"
description = "C ABI wrapper for LibreSync core."
repository = "https://github.com/dan-hart/LibreSync"
homepage = "https://github.com/dan-hart/LibreSync"
readme = "../../bindings/README.md"
keywords = ["sync", "local-first", "ffi", "swift", "kotlin"]
categories = ["development-tools::ffi-bindings", "network-programming"]

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
libresync = { path = "../libresync", version = "0.6.1", features = ["sqlite-logical"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"

[dev-dependencies]
tempfile = "3.10"
