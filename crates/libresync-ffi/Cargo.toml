[package]
name = "libresync-ffi"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "C ABI wrapper for LibreSync core."

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
libresync = { path = "../libresync" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
