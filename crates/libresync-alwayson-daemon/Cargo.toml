[package]
name = "libresync-alwayson-daemon"
version = "0.6.1"
edition = "2021"
license = "AGPL-3.0-only"
description = "Headless daemon for LibreSyncAlwaysOn."
repository = "https://github.com/dan-hart/LibreSync"
homepage = "https://github.com/dan-hart/LibreSync"
readme = "../../contrib/README.md"
keywords = ["sync", "local-first", "daemon"]
categories = ["network-programming"]

[dependencies]
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.6", features = ["v4"] }
whoami = "1.5"
directories = "5.0"
ctrlc = "3.4"
libresync = { path = "../libresync", version = "0.6.1" }

[dev-dependencies]
tempfile = "3.10"
