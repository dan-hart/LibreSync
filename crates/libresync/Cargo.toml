[package]
name = "libresync"
version = "0.3.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Local-only device-to-device sync core for LibreSync."

[dependencies]
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
serde_json = "1.0"
flume = "0.11"
if-addrs = "0.10"
mdns-sd = "0.10"
rcgen = "0.12"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.10"
notify = "6.1"
chacha20poly1305 = { version = "0.10", features = ["std"] }
rand_core = "0.6"
rusqlite = { version = "0.31", features = ["bundled"], optional = true }

[features]
sqlite-logical = ["rusqlite"]
# Read Tailscale peers from the local API socket (for Flatpak sandboxes where the
# `tailscale` CLI is unavailable but `--filesystem=/var/run/tailscale` is granted).
tailscale-local-api = []

[dev-dependencies]
tempfile = "3.10"
rusqlite = { version = "0.31", features = ["bundled"] }
