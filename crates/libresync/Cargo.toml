[package]
name = "libresync"
version = "0.1.5"
edition = "2021"
license = "AGPL-3.0-only"
description = "Local-only device-to-device sync core for LibreSync."

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
flume = "0.11"
if-addrs = "0.10"
mdns-sd = "0.10"
rcgen = "0.12"
rustls = { version = "0.21", features = ["dangerous_configuration"] }
sha2 = "0.10"
notify = "6.1"
chacha20poly1305 = { version = "0.10", features = ["std"] }
rand_core = "0.6"

[dev-dependencies]
tempfile = "3.10"
