[package]
name = "libresync-cli"
version = "0.5.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "CLI for LibreSync."

[[bin]]
name = "libresync"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
chrono = "0.4"
ctrlc = "3.4"
directories = "5.0"
libresync = { path = "../libresync" }
notify = "6.1"
rand = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.30"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.10"
