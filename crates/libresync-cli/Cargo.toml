[package]
name = "libresync-cli"
version = "0.6.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "CLI for LibreSync."
repository = "https://github.com/dan-hart/LibreSync"
homepage = "https://github.com/dan-hart/LibreSync"
readme = "../../README.md"
keywords = ["sync", "local-first", "p2p", "cli"]
categories = ["command-line-utilities", "network-programming"]

[[bin]]
name = "libresync"
path = "src/main.rs"
# The binary shares its name with the library crate; skip it in `cargo doc`.
doc = false

[dependencies]
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
chrono = "0.4"
ctrlc = "3.4"
directories = "5.0"
libresync = { path = "../libresync" }
notify = "6.1"
rand = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.30"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.10"
