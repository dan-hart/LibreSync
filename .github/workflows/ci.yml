name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: ${{ matrix.os == 'macos-14' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Cargo test (workspace)
        run: cargo test --workspace
      - name: Cargo test (core, all features)
        run: cargo test -p libresync --all-features
      - name: Two-device concurrent-edit and delta tests
        run: cargo test -p libresync --test two_device -- --nocapture
      - name: FFI build (static + dynamic library)
        run: cargo build -p libresync-ffi --release
      - name: FFI tests
        run: cargo test -p libresync-ffi
      - name: Universal FFI library + Swift package (macOS)
        if: runner.os == 'macOS'
        run: |
          scripts/build-macos-universal.sh
          cd bindings/swift
          swift build
          swift test

  release-checks:
    name: release readiness, audits, coverage (ubuntu)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - uses: Swatinem/rust-cache@v2
      - name: Release readiness
        run: ./scripts/utilities/check-release-readiness.sh
      - name: Security audit
        run: ./scripts/utilities/security-audit.sh
      - name: Cargo audit
        run: cargo audit
      - name: Coverage gate
        run: cargo llvm-cov --workspace --summary-only --fail-under-regions 75
      - name: Install AlwaysOn build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: AlwaysOn smoke build
        run: cargo check --manifest-path alwaysOn/libresync-always-on/src-tauri/Cargo.toml
