<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LibreSyncAlwaysOn</title>
    <style>
      body {
        margin: 0;
        font-family: "IBM Plex Mono", "SFMono-Regular", ui-monospace, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        background: linear-gradient(135deg, #f5f1e8 0%, #dfe8d7 100%);
        color: #1c1c1c;
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
      }
      main {
        max-width: 640px;
        padding: 32px;
        background: rgba(255, 255, 255, 0.8);
        border: 1px solid #c9c2b3;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.08);
      }
      h1 {
        margin: 0 0 12px;
        font-size: 28px;
        letter-spacing: 0.5px;
      }
      p {
        margin: 0 0 12px;
        line-height: 1.5;
      }
      .status {
        margin-top: 16px;
        padding: 12px 16px;
        background: #1b2a1b;
        color: #f2f5e9;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>LibreSyncAlwaysOn</h1>
      <p>Always-on device for LibreSync. LAN-only, no cloud, no surprises.</p>
      <p>Engine wiring is stubbed; UI will show device status and sync health.</p>
      <div class="status">Always-on device placeholder</div>
    </main>
  </body>
</html>
