[package]
name = "frankly"
version = "0.0.1"
edition = "2021"

[build-dependencies]
tauri-build = "2"

[dependencies]
base64 = "0.22"
libresync = { path = "../../crates/libresync" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
tauri = "2"
uuid = { version = "1", features = ["v4"] }
whoami = "1.5"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[workspace]
