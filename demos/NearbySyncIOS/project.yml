name: NearbyNotesIOS
options:
  bundleIdPrefix: io.libresync
  deploymentTarget:
    iOS: '17.0'
packages:
  LibreSync:
    path: ../../bindings/swift
settings:
  base:
    SWIFT_VERSION: '5.0'
    DEVELOPMENT_TEAM: ''
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
targets:
  NearbyNotesIOS:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: ../NearbySyncMac/Sources/NearbySyncMac/DemoModel.swift
      - path: ../NearbySyncMac/Sources/NearbySyncMac/DemoStorage.swift
    dependencies:
      - package: LibreSync
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.libresync.NearbySyncDemo
        TARGETED_DEVICE_FAMILY: '1,2'
        GENERATE_INFOPLIST_FILE: YES
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Nearby Notes
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSLocalNetworkUsageDescription: Nearby Notes finds and securely syncs notes with devices you connect on your local network.
        NSBonjourServices:
          - _libresync._tcp
        NSCameraUsageDescription: Scan a pairing QR code displayed by a device you want to connect.
schemes:
  NearbyNotesIOS:
    build:
      targets:
        NearbyNotesIOS: all
    run:
      config: Debug
